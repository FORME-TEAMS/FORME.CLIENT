name: ForMe.World — macOS
on:
  pull_request:
    branches:
      - fix/forme-no-voice-preflight-missing-asset
  workflow_dispatch:
    inputs:
      grid_url:
        description: URL служб входа ForMe.World
        type: string
        required: true
        default: http://185.173.93.200:8002/
permissions:
  contents: read
concurrency:
  group: forme-macos-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 330
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      AUTOBUILD_BUILD_ID: ${{ github.run_id }}
      AUTOBUILD_GITHUB_TOKEN: ${{ github.token }}
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
      FORME_WORLD_LOGIN_URI: ${{ inputs.grid_url || 'http://185.173.93.200:8002/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bash gnu-sed pkg-config
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          python -m pip install -r requirements.txt 'cmake>=3.28,<4'
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          mkdir -p forme-macos-logs
          xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: .autobuild-installables
          key: forme-macos-packages-${{ hashFiles('autobuild.xml', 'scripts/forme_client.py') }}
      - name: Configure ForMe.World
        shell: bash
        run: |
          set -euo pipefail
          python scripts/forme_client.py configure 2>&1 | tee forme-macos-logs/configure.log
      - name: Verify configured macOS optional dependencies
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'USE_BUGSPLAT:BOOL=OFF' build-darwin-universal/CMakeCache.txt
          grep -qx 'USE_OPENAL:BOOL=ON' build-darwin-universal/CMakeCache.txt
      - name: Compile universal application
        shell: bash
        run: |
          set -euo pipefail
          python scripts/forme_client.py build --jobs 3 2>&1 | tee forme-macos-logs/build.log
      - name: Bundle ForMe.World
        run: python scripts/forme_client.py bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ForMe.World-macOS
          path: dist/ForMe.World-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ForMe.World-macOS-logs
          path: |
            forme-macos-logs/
            build-darwin-universal/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
